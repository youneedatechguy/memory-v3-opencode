[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-v3"
version = "1.0.0"
description = "Next-generation brain-inspired persistent memory for AI coding assistants"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Sean Pembroke" },
]
dependencies = [
    "fastmcp>=2.0",
    "numpy>=1.24",
    "networkx>=3.0",
    "sqlite-vec>=0.1",
]

[project.optional-dependencies]
ollama = ["ollama>=0.4"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
local = ["sentence-transformers>=2.2"]
graph = ["python-igraph>=0.11", "leidenalg>=0.10", "pyvis>=0.3"]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]
all = [
    "ollama>=0.4",
    "openai>=1.0",
    "anthropic>=0.40",
    "sentence-transformers>=2.2",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "pyvis>=0.3",
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
memory-v3 = "memory_v3.cli:main"
memory-v3-server = "memory_v3.server:run"
memory-v3-build-kg = "memory_v3.build_kg:main"
memory-v3-migrate = "memory_v3.migration:main"

[project.urls]
Homepage = "https://github.com/Haustorium12/memory-v3"
"Predecessor (v2)" = "https://github.com/Haustorium12/memory-v2"
"Original (v1)" = "https://github.com/Haustorium12/claude-memory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
